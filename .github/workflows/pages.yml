name: Deploy Schedule+ to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Align published bootstrap version
        shell: bash
        run: |
          VERSION=$(sed -n "s/^const APP_VERSION='\([^']*\)'.*/\1/p" version.js)
          if [ -z "$VERSION" ]; then
            echo "Could not read APP_VERSION from version.js" >&2
            exit 1
          fi
          perl -0pi -e "s/\\?v=[0-9.]+/?v=$VERSION/g; s/Version [0-9]+\\.[0-9]+\\.[0-9]+/Version $VERSION/g" index.html
          echo "Publishing Schedule+ v$VERSION"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
