<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101010"><title>Power Up Group | Google Reviews</title><meta name="description" content="Share your experience with Power Up Group on Google."><style>

<script>const url='https://g.page/r/CYpE1dFolaLqEAE/review';const status=document.getElementById('status');function note(s){status.textContent=s}document.getElementById('share').onclick=async()=>{if(navigator.share){try{await navigator.share({title:'Review Power Up Group',text:'We would appreciate your feedback on Google.',url})}catch(e){if(e.name!=='AbortError')note('Sharing unavailable — copy the review link')}}else{try{await navigator.clipboard.writeText(url);note('Review link copied — ready to share')}catch{prompt('Copy the review link:',url)}}};document.getElementById('download').onclick=async()=>{const src=document.getElementById('qr').src;try{const res=await fetch(src);if(!res.ok)throw Error('QR unavailable');const blob=await res.blob();const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='power-up-google-review-qr.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}catch{window.open(src,'_blank');note('Long-press the QR image to save it')}};</script></body></html>
